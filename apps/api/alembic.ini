[alembic]
script_location = alembic
prepend_sys_path = .
# No URL here on purpose: alembic/env.py resolves the target through
# everest_api.persistence.database.resolve_database_url() so migrations, the
# API and the scheduler can never drift onto different databases.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
