[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[project]
name = 'weather-ingestion-contract'
version = '0.1.0'
description = 'Owner-neutral DTOs and port for Everest weather ingestion'
requires-python = '>=3.11'
dependencies = []

[tool.black]
line-length = 80
target-version = ['py311']
extend-exclude = '''
(
  /build/
  | /dist/
  | /[^/]+\.egg-info/
  | /\.pytest_cache/
  | /__pycache__/
)
'''

[tool.pylint.main]
ignore = ['CVS', 'build', 'dist', '.pytest_cache', '__pycache__']
ignore-patterns = ['^\\.#', '^.*[.]egg-info$']
ignore-paths = [
    '.*[\\/](build|dist|[^\\/]+[.]egg-info|[.]pytest_cache|__pycache__)([\\/]|$)',
]
load-plugins = []
recursive = true


[tool.setuptools.packages.find]
include = ['weather_ingestion_contract*']
