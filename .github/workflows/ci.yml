name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: everest
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: everest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U everest -d everest_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/apps/api:${{ github.workspace }}/packages/weather_ingestion_contract
      EVEREST_TEST_DATABASE_URL: postgresql+psycopg://everest:ci-only-password@127.0.0.1:5432/everest_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./packages/weather_ingestion_contract
          python -m pip install -e './apps/api[weather-ingestion,test,lint]'
      - name: Test weather and risk services
        run: python -m pytest services/weather/tests services/risk/tests -q
      - name: Test API without PostgreSQL-native tests
        run: >-
          python -m pytest apps/api/tests -q
          --ignore=apps/api/tests/test_postgres_registry.py
          --ignore=apps/api/tests/test_storage_version.py
          --ignore=apps/api/tests/test_weather_persistence.py
          --ignore=apps/api/tests/test_weather_queries.py
          --ignore=apps/api/tests/test_osm_service.py
          --ignore=apps/api/tests/test_gfs_adapter_integration.py
          --ignore=apps/api/tests/test_aifs_adapter_integration.py
          --ignore=apps/api/tests/test_icon_adapter_integration.py
          --ignore=apps/api/tests/test_sources_integration.py
      - name: Test PostgreSQL and provider adapters
        run: >-
          python -m pytest -q
          apps/api/tests/test_postgres_registry.py
          apps/api/tests/test_storage_version.py
          apps/api/tests/test_weather_persistence.py
          apps/api/tests/test_weather_queries.py
          apps/api/tests/test_osm_service.py
          apps/api/tests/test_gfs_adapter_integration.py
          apps/api/tests/test_aifs_adapter_integration.py
          apps/api/tests/test_icon_adapter_integration.py
          apps/api/tests/test_sources_integration.py
      - name: Check changed Python formatting
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA=$(git rev-list --max-parents=0 HEAD)
          fi
          api_files=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$GITHUB_SHA" -- 'apps/api/**/*.py' 'apps/api/*.py' | sed 's#^apps/api/##')
          weather_files=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$GITHUB_SHA" -- 'services/weather/**/*.py' 'services/weather/*.py' | sed 's#^services/weather/##')
          if [[ -n "$api_files" ]]; then
            (cd apps/api && python -m black --check $api_files)
          fi
          if [[ -n "$weather_files" ]]; then
            (cd services/weather && python -m black --check $weather_files)
          fi
      - name: Compile Python sources
        run: python -m compileall -q apps/api services packages/weather_ingestion_contract

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_EVEREST_API_BASE_URL: http://localhost:52147
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Critical dependency gate
        run: npm audit --audit-level=critical
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    needs: [python, frontend, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - name: api
            file: infra/docker/api.Dockerfile
          - name: worker
            file: infra/docker/worker.Dockerfile
          - name: web
            file: infra/docker/web.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose profiles
        env:
          EVEREST_DB_PASSWORD: ci-compose-only
        run: |
          docker compose -f infra/docker/compose.yml config >/dev/null
          test "$(docker compose -f infra/docker/compose.yml config --services)" = "postgres"
          app_services=$(docker compose -f infra/docker/compose.yml --profile app config --services)
          jobs_services=$(docker compose -f infra/docker/compose.yml --profile jobs config --services)
          grep -qx postgres <<<"$app_services"
          grep -qx migrate <<<"$app_services"
          grep -qx api <<<"$app_services"
          grep -qx web <<<"$app_services"
          grep -qx postgres <<<"$jobs_services"
          grep -qx migrate <<<"$jobs_services"
          grep -qx scheduler <<<"$jobs_services"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          tags: everest-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
